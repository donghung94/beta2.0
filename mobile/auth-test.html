<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auth Test — SoraKanji (tạm, sẽ xóa sau khi chẩn đoán xong)</title>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;margin:16px;color:#222}
  h1{font-size:18px} p{font-size:14px;line-height:1.5}
  button{font-size:16px;padding:12px 18px;margin:6px 6px 6px 0;border-radius:10px;border:1px solid #999;background:#fff}
  button.primary{background:#c0392b;color:#fff;border-color:#c0392b}
  #log{margin-top:14px;padding:10px;background:#111;color:#0f0;font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;border-radius:8px;min-height:200px}
  #state{margin-top:10px;padding:10px;background:#f4f4f4;border-radius:8px;font-size:13px;white-space:pre-wrap}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>
<h1>Auth Test (trang chẩn đoán tạm thời)</h1>
<p>Trang này chỉ để chẩn đoán lỗi đăng nhập Google trên mobile. Bấm nút bên dưới rồi đọc nhật ký.</p>
<button class="primary" id="btnPopup">Đăng nhập Google (POPUP)</button>
<button id="btnRedirect">Đăng nhập Google (REDIRECT)</button>
<button id="btnSignOut">Đăng xuất</button>
<button id="btnCheck">Kiểm tra currentUser ngay</button>
<div id="state">—</div>
<div id="log"></div>
<script>
var logEl = document.getElementById("log");
var stateEl = document.getElementById("state");
var listenerFires = 0;
function ts(){ var d = new Date(); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+":"+("0"+d.getSeconds()).slice(-2); }
function log(msg){ logEl.textContent += "[" + ts() + "] " + msg + "\n"; }
function userStr(u){
  if(!u) return "null";
  var provs = [];
  try{ (u.providerData||[]).forEach(function(p){ provs.push(p.providerId + "|email=" + (p.email||"-") + "|name=" + (p.displayName||"-")); }); }catch(e){ provs.push("(lỗi đọc providerData)"); }
  return "email=" + (u.email||"(không có)") + " uid=" + u.uid + " isAnonymous=" + u.isAnonymous + " emailVerified=" + u.emailVerified + " displayName=" + (u.displayName||"(không có)") + " photo=" + (u.photoURL?"có":"không") + " providers=[" + (provs.length?provs.join("; "):"(không có)") + "]";
}
function updateState(){
  try{
    var auth = firebase.auth();
    var cu = auth.currentUser;
    var lsKeys = [], ssKeys = [];
    for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k && k.indexOf("firebase")>=0) lsKeys.push(k); }
    for(var j=0;j<sessionStorage.length;j++){ var k2=sessionStorage.key(j); if(k2 && (k2.indexOf("firebase")>=0 || k2.indexOf("pendingRedirect")>=0)) ssKeys.push(k2); }
    stateEl.textContent = "currentUser: " + userStr(cu) +
      "\nlistener đã bắn: " + listenerFires + " lần" +
      "\nlocalStorage firebase keys: " + (lsKeys.length ? lsKeys.join(", ") : "(không có)") +
      "\nsessionStorage firebase keys: " + (ssKeys.length ? ssKeys.join(", ") : "(không có)");
  }catch(e){ stateEl.textContent = "lỗi đọc state: " + e.message; }
}
log("Trang đã tải. firebase = " + (typeof firebase));
try{
  var CFG = {
    apiKey: "AIzaSyALblbqW_VrZh2r7sPJ8Q6XT2fGbk0dsFg",
    authDomain: "donghung-3208d.firebaseapp.com",
    projectId: "donghung-3208d",
    storageBucket: "donghung-3208d.firebasestorage.app",
    messagingSenderId: "753379492663",
    appId: "1:753379492663:web:baff34f2c0bac00e02d0b2"
  };
  log("CFG: dùng đúng SVU_FB_CONFIG của app.");
  if(!firebase.apps.length) firebase.initializeApp(CFG);
  log("Firebase app đã khởi tạo: " + firebase.apps.length + " app");
  var auth = firebase.auth();
  log("auth instance: OK");
  auth.onAuthStateChanged(function(user){
    listenerFires++;
    log("LISTENER bắn lần " + listenerFires + ": user = " + userStr(user));
    updateState();
  });
  log("Listener đã đăng ký.");
  auth.getRedirectResult().then(function(result){
    log("getRedirectResult xong: user = " + userStr(result && result.user));
    updateState();
  }).catch(function(err){
    log("getRedirectResult LỖI: " + (err && err.code) + " — " + (err && err.message));
  });
  setInterval(updateState, 2000);
  updateState();
}catch(e){
  log("LỖI KHỞI TẠO: " + e.message);
}
document.getElementById("btnPopup").addEventListener("click", function(){
  log("Bấm POPUP: gọi signInWithPopup...");
  var provider = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider).then(function(cred){
    log("POPUP RESOLVE: user = " + userStr(cred && cred.user) + " | cred có user: " + !!(cred && cred.user));
    updateState();
  }).catch(function(err){
    log("POPUP REJECT: code=" + (err && err.code) + " — " + (err && err.message));
    updateState();
  });
  log("signInWithPopup đã gọi, đang chờ...");
});
document.getElementById("btnRedirect").addEventListener("click", function(){
  log("Bấm REDIRECT: gọi signInWithRedirect, trang sẽ rời đi...");
  var provider = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithRedirect(provider).catch(function(err){
    log("REDIRECT LỖI NGAY: code=" + (err && err.code) + " — " + (err && err.message));
  });
});
document.getElementById("btnSignOut").addEventListener("click", function(){
  firebase.auth().signOut().then(function(){ log("Đã đăng xuất."); updateState(); })
    .catch(function(err){ log("Lỗi đăng xuất: " + err.message); });
});
document.getElementById("btnCheck").addEventListener("click", function(){
  var u = firebase.auth().currentUser;
  log("Kiểm tra tay: currentUser = " + userStr(u));
  if(u){
    u.getIdTokenResult().then(function(r){
      log("TOKEN claims: " + JSON.stringify(r.claims));
      log("TOKEN sign_in_provider: " + (r.claims.firebase && r.claims.firebase.sign_in_provider));
    }).catch(function(err){ log("TOKEN LỖI: " + err.message); });
  }
  updateState();
});
</script>
</body>
</html>
